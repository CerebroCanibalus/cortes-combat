                include '**/*.java'
                exclude v120Replaces
                filter(renameLine)
            }
        }
        into('resources') {
            from(rootProject.file('src/main/resources')) {
                include '**/*.json'
                include '**/*.mcmeta'
                include '**/*.toml'
                include '**/*.properties'
                include '**/*.txt'
                // El mixins.json lo pone la pata (src/v120/resources): lleva el
                // `refMap` que la 1.21.1 no usa. Sin este exclude viajan los dos
                // y el refmap apunta al que no lo declara. (μ_μ)
                exclude 'cortescombat.mixins.json'
                filter(renameLine)
            }
            from(rootProject.file('src/main/resources')) {
                exclude '**/*.json'
                exclude '**/*.mcmeta'
                exclude '**/*.toml'
                exclude '**/*.properties'
                exclude '**/*.txt'
            }
        }
        into layout.buildDirectory.dir('forgeSrc')
    }
    // The leg compiles the renamed tree instead of the shared one. Placed at the end of the
    // script on purpose: setSrcDirs replaces, so it must run after every srcDir above.
    // `build/forgeSrc` stays leg-relative (it IS a build output); generated data and expanded
    // metadata are root-anchored because they live in the shared tree.
    //
    // Files with a 1.20.1-native body live in src/v120 and REPLACE their shared twin, which the
    // Sync above already excluded from the renamed copy. v120 sources are 1.20.1-native
    // (net.minecraftforge imports) and never pass through renameForgeSources.
    sourceSets.main.java.setSrcDirs([layout.buildDirectory.dir('forgeSrc/java').get().asFile])
    sourceSets.main.java.srcDir(rootProject.file('src/v120/java'))
    sourceSets.main.resources.setSrcDirs([layout.buildDirectory.dir('forgeSrc/resources').get().asFile,
            rootProject.file('src/generated-1.20.1/resources'), generateModMetadata])
    sourceSets.main.resources.srcDir(rootProject.file('src/v120/resources'))
    tasks.named('compileJava', JavaCompile).configure {
        dependsOn(forgeSrc)
    }
    tasks.named('processResources', Copy).configure {
        dependsOn(forgeSrc)
    }
    // The 1175 unit tests run on the 1.21.1 leg only. They read the shared tree as text
    // and assert 1.21.1 wiring (DeferredHolder, NeoForge buses, singular datagen folders),
    // so compiling them against the 1.20.1 leg fails on purpose -- MaceRebalance, for
    // example, has no twin because there is no vanilla mace to rebalance. The 1.20.1 leg
    // is verified by compilation plus a real server boot (see test-server-1.20.1/), not
    // by re-running a suite that describes the other leg.
    tasks.named('compileTestJava', JavaCompile).configure {
        enabled = false
    }
    tasks.named('test', Test).configure {
        enabled = false
    }
    // FG6 creates the jarJar task disabled; without this the jar ships without its
    // embedded libraries and the server dies with NoClassDefFoundError (verified:
    // `Task is enabled is false` in the jarJar log). Project-qualified because a bare
    // `jarJar { }` would resolve to the dependency *configuration* of the same name.
    project.extensions.getByName('jarJar').with {
        enable()
    }
}
