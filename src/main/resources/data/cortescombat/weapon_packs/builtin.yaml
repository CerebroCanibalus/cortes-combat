# ═══ WEAPON PACKS BUILT-IN de Cortés Combat / BUILT-IN WEAPON PACKS ═══════════
# El traductor de categorías: la llave por la que un tercero entra sin escribir YAML.
# Category translator: the key by which a third party enters without writing YAML.
# Un datapack pone su item en #cortescombat:category/<tipo> y esto lo convierte en
# arquetipo -- molde de movimiento, mecánica y defaults. Vive en el classpath y tiene
# MENOR prioridad que cualquier archivo de config/cortescombat/weapons/*.yaml.
# A datapack puts its item in #cortescombat:category/<type> and this converts it to
# archetype -- movement template, mechanics and defaults. Lives in the classpath and has
# LOWER priority than any config/cortescombat/weapons/*.yaml file.
# (Los nueve arquetipos no están acá: son código, en ArchetypeSpec.)
# (The nine archetypes are not here: they are code, in ArchetypeSpec.)
# Los packs oficiales de compat con otros mods se añaden en futuras versiones.
# Official compat packs with other mods are added in future versions.
# Compat templates available (copy from src or data/ to config/):
#   - compat_spartan_weaponry.yaml.example (Spartan Weaponry, 30+ weapon types)
#   - compat_simply_swords.yaml.example (Simply Swords, 50+ weapons)
#   - compat_soulslike_weaponry.yaml.example (Marium's Soulslike Weaponry, 40+ weapons)
#   - compat_example.yaml.example (generic template)
version: 1
weapons:
  - match: { tag: "#cortescombat:category/dagger" }
    archetype: dagger
  - match: { tag: "#cortescombat:category/sword" }
    archetype: sword
  - match: { tag: "#cortescombat:category/rapier" }
    archetype: rapier
  - match: { tag: "#cortescombat:category/sabre" }
    archetype: sabre
  - match: { tag: "#cortescombat:category/hammer" }
    archetype: hammer
  - match: { tag: "#cortescombat:category/mace" }
    archetype: mace
  - match: { tag: "#cortescombat:category/spear" }
    archetype: spear
  - match: { tag: "#cortescombat:category/polearm" }
    archetype: polearm
  - match: { tag: "#cortescombat:category/axe" }
    archetype: axe
