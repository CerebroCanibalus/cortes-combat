// Two toolchains, one script: Stonecutter runs this file once per version (a "build instance"),
// and `stonecutter.current.version` says which one is being configured. The 1.21.1 leg keeps the
// ModDevGradle setup this file always had; the 1.20.1 leg uses ForgeGradle 6 (the home-turf
// toolchain for 1.20.1: ModDevGradle does not do 1.20.1, and ForgeGradle does not do 1.21).
// Per-version pins live in versions/<mc>/gradle.properties, so this file branches but never
// hardcodes a version. (⌒‿⌒)
buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'net.neoforged.moddev:net.neoforged.moddev.gradle.plugin:2.0.141'
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

def mc121 = stonecutter.current.version == '1.21.1'
if (mc121) {
    apply plugin: 'net.neoforged.moddev'
} else {
    apply plugin: 'net.minecraftforge.gradle'
    // MixinGradle solo en la 1.20.1: genera el refmap que traduce los mixins de
    // Mojmap (dev) a SRG (produccion). La 1.21.1 usa Mojmap en ambos lados y
    // ModDevGradle ya se encarga; aplicar esto alla romperia su pipeline.
    // (verificado en el wiki Mixins-on-Minecraft-Forge de SpongePowered). (⌒‿⌒)
    apply plugin: 'org.spongepowered.mixin'
    // **El refmap: el AP no lo escribe solo, y cuando lo escribe nadie lo empaqueta.**
    //
    // Medido en la ronda del release (Gradle 8.12 + ForgeGradle 6 + MixinGradle 0.7.38):
    //  1. `compileJava.options.compilerArgs` y `compilerArgumentProviders` quedan
    //     VACIOS: MixinGradle no inyecta `-AoutRefMapFile`, asi que el AP de Mixin no
    //     emite `cortescombat.refmap.json`. Los argumentos de abajo son lo que el AP
    //     pide en modo legacy, con el `.tsrg` MCP->SRG que ForgeGradle ya genera.
    //  2. Cuando SI lo emite, MixinGradle lo mueve a `build/tmp/compileJava/` y NO lo
    //     agrega al jar (`mixin { add ... }` no lo hace en esta combinacion). Asi que
    //     se adjunta a todos los sabores de jar desde ahi.
    //
    // Por que nadie lo notaba: el build incremental arrastraba un refmap de un build
    // viejo en `build/classes`, el jar lo empaquetaba, y todo "andaba". **Un `clean`
    // lo borro y el jar de release arranco con
    // `Mixin apply failed ... could not find any targets matching
    //  'calculateTargetStrength' ... No refMap loaded`** -- los mixins sin traducir a
    // SRG, o sea el mod entero caido. Un release limpio es lo que lo encontro. (μ_μ)
    tasks.named('compileJava', JavaCompile).configure {
        def refmapFile = layout.buildDirectory
                .file('classes/java/main/cortescombat.refmap.json')
        def srgMap = layout.buildDirectory.file('createMcpToSrg/output.tsrg')
        dependsOn 'createMcpToSrg'
        // **El refmap se declara como OUTPUT y ademas la tarea NO se cachea.**
        //
        // `outputs.file` lo pone en la clave y en el restaurado; `cacheIf { false }` es el
        // cinturon: medido en la ronda del release, un `compileJava` restaurado desde el
        // build cache devolvio las clases SIN el refmap **incluso con el output
        // declarado** (`FROM-CACHE`, jar sin refmap, server muerto al arrancar). El
        // annotation processor escribe un archivo que el cache no reproduce de forma
        // confiable, asi que esta tarea paga sus diez segundos y deja de mentir: un jar
        // verde con el mod caido es peor que un build lento. (μ_μ)
        outputs.file(refmapFile)
        outputs.cacheIf { false }
        options.compilerArgs += [
                '-AoutRefMapFile=' + refmapFile.get().asFile.absolutePath,
                '-AdefaultObfuscationEnv=searge',
                '-AmappingTypes=tsrg',
                '-Amappings=' + srgMap.get().asFile.absolutePath,
        ]
    }
    tasks.withType(Jar).configureEach {
        // **Y al jar, desde los dos lugares donde puede quedar.** MixinGradle copia el
        // refmap del AP a `tmp/compileJava/`; cual de los dos existe depende de la
        // version del plugin, asi que se piden los dos y el primero gana (el contenido
        // es el mismo archivo, 10 KB). (μ_μ)
        from(layout.buildDirectory.file('classes/java/main/cortescombat.refmap.json'))
        from(layout.buildDirectory.file('tmp/compileJava/cortescombat.refmap.json'))
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        dependsOn 'compileJava'
    }
}

// The wrapper task lives on the root project only: version subprojects evaluating this
// script would fail looking it up, so it is fenced to root. (￣ω￣)
if (project == rootProject) {
tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}
}

version = "${mod_version}-${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    // Root-anchored on purpose: version subprojects run with their own directory as CWD, and a
    // relative path would point at versions/<mc>/src, which does not exist. (⌒‿⌒)
    srcDir(rootProject.file('src/generated/resources'))

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // ForgeGradle resolves the userdev (Forge 1.20.1-47.x) and the official mappings from here.
    // Declared explicitly so the 1.20.1 leg does not depend on whatever the plugin auto-adds.
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    if (!mc121) {
        // MixinGradle + el annotation processor salen de aca.
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

base {
    archivesName = "Cortes-combat"
}

// Mojang ships Java 21 to end users in 1.21, and Java 17 in 1.20.1, so each leg targets its own.
// `java_version` comes from the leg's own gradle.properties, never from a hardcoded number here,
// or the next version bump pays it twice. (⌒‿⌒)
java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

if (mc121) {
neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // **Su propio directorio, y no es una preferencia de orden.**
            //
            // Sin esto `server`, `gameTestServer` y `data` caen todos en `run/`, el mismo que el
            // cliente. Dos instancias con DOS `ConfigWatcher` sobre el mismo
            // `cortescombat-server.toml`: cada una escribe lo que la otra acaba de corregir.
            // El sintoma es un `is not correct. Correcting` cada medio segundo y un `.bak` numerado
            // por vuelta -- cinco en dos segundos el 2026-10-12 -- y **cero en todos los otros
            // logs**, porque en los otros solo corria una instancia. Ese cero es la prueba de que
            // el spec esta bien y el problema era el directorio compartido.
            //
            // Y el spam es lo de menos: lo que de verdad comparten es `run/saves/`, y dos instancias
            // sobre el mismo nivel es como se pierde un mundo de pruebas.
            gameDirectory = project.file('runs/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // Su propio directorio, por lo mismo que el server: ver la nota de arriba.
            gameDirectory = project.file('runs/gameTest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')
            //
            // **Y se descomenta, por lo mismo que el server.** `runData` corre en el mismo directorio
            // que el cliente si este esta abierto, y los dos se pisan el `cortescombat-*.toml` de la
            // misma forma. `run-data/` ya esta en `.gitignore`.
            gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            //
            // No '--all'. It asks the generator to run vanilla's own providers alongside ours in the
            // same DataGenerator, and they register under bare names: RecipeProvider.getName() is
            // final and returns "Recipes", so our recipe provider collided with Mojang's and
            // runData died with
            //
            //     IllegalStateException: Duplicate provider: Recipes
            //
            // naming neither this mod nor this class. It reads like a broken generator, and the fix
            // is a missing flag rather than a wrong provider.
            //
            // Its only other effect was regenerating vanilla's data into our output folder, which
            // is thousands of files we do not ship and do not want to review.
            programArguments.addAll '--mod', project.mod_id, '--output', rootProject.file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
} // neoForge
} // if (mc121): the whole ModDev block above is the 1.21.1 leg; the 1.20.1 leg speaks ForgeGradle below.

if (!mc121) {
// ForgeGradle 6 is the home-turf toolchain for 1.20.1: ModDevGradle does not do 1.20.1, and the
// NeoForge-20.1 fork keeps Forge's net.minecraftforge packages, so the 1.20.1 leg compiles the
// same tree with the old package names (see the replacements in stonecutter.gradle).
minecraft {
    mappings channel: project.mappings_channel, version: project.mappings_version

    // The mod's own access transformers, if it ever needs any. None today; the line stays as
    // the documented place to declare them, the same way ModDev auto-detects them above.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            // Each leg gets its own game directory for the same reason the 1.21.1 runs do:
            // two instances sharing a directory corrupt each other's configs and worlds.
            workingDirectory project.file('runs-1.20.1/client')
            property 'forge.enabledGameTestNamespaces', project.mod_id
            // `gradlew :1.20.1:renameForgeSources` ... y `-Pquickplay` abre el mundo directamente
            // (1.20 introdujo Quick Play: sin titulo, sin clicks). Instrumento de playtest.
            if (project.hasProperty('quickplay')) {
                args '--quickPlaySingleplayer', 'New World'
            }
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('runs-1.20.1/server')
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods { "${mod_id}" { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('runs-1.20.1/data')
            property 'forge.enabledGameTestNamespaces', project.mod_id
            // Per-leg data output: 1.20.1 reads `recipes/` + `advancements/` (plural) and the
            // old result shape (`{"item":...}`), while 1.21.1 reads the singular folders and
            // `{"id":...}`. One shared folder would serve stale files to both legs with no
            // owner, so this leg writes its own tree, tracked in git like the shared one.
            // `--server --client` and not `--all`: the v120 providers gate on
            // `event.includeServer()/includeClient()`, and without the flags Forge builds the
            // event with both false -- runData then succeeds with zero providers and an empty
            // folder (verified: "All providers took: 0 ms"). `--all` would additionally drag
            // vanilla's own providers into our folder, which we do not ship.
            args '--mod', project.mod_id, '--server', '--client', '--output', rootProject.file('src/generated-1.20.1/resources/').getAbsolutePath(), '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
} // minecraft
} // if (!mc121)

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
// `localRuntime` is a ModDev configuration: dependencies present for run testing but not
// published. ForgeGradle has no such configuration, so the block only exists on the 1.21.1 leg.
if (mc121) {
    configurations {
        runtimeClasspath.extendsFrom localRuntime
    }
}

dependencies {
    if (!mc121) {
        // The 1.20.1 leg compiles against Forge 47.x (net.minecraftforge packages). NeoForge 20.1
        // is the same code under another group, but Forge is what the users run, so Forge is what
        // the leg builds against. (μ_μ)
        minecraft "net.minecraftforge:forge:${project.forge_version}"
    }
    // Pure-math unit tests run on the JVM without booting Minecraft.
    // That is only viable because com.cortes.combat.reach.ConeMath has no Minecraft types in
    // its signature. Keep it that way: if you add a Vec3 parameter, this test stops working.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // DataFixerUpper is dragged in by any class holding a Codec, which every data component
    // and profile in this mod does. Without it the unit tests die at class-init with
    // NoClassDefFoundError: com/mojang/datafixers/kinds/App, and the failure looks like a
    // broken test rather than a missing dependency.
    //
    // **And `testImplementation`, not only `testRuntimeOnly`, since the pose format's tests call
    // `Codec.parse` on a codec they read off the class.** `testRuntimeOnly` puts the jar on the
    // runtime classpath, which is enough for a class to *load* and not enough for `javac` to
    // resolve a symbol in it -- so the first version of that test failed to compile with
    // "cannot access Codec" on a dependency that was already there. A test that holds a Codec
    // needs to see the Codec.
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    testRuntimeOnly 'com.mojang:datafixerupper:8.0.16'

    // Netty, and only so that `ViewModelChannels`'s codec can be tested.
    //
    // **It is not in the neoforge jar.** `neoforge-21.1.250-merged.jar` has
    // `net/minecraft/network/codec/StreamCodec.class` and does *not* have
    // `io/netty/buffer/Unpooled.class`: Mojang ships netty as separate libraries and the game
    // resolves them at launch, so a test classpath built from the moddev jar has the codec's
    // interface and not its buffer.
    //
    // Version read out of the 1.21.1 version manifest rather than picked: `4.1.97.Final` is what
    // the launcher downloads, and `4.1.118` is also in the Gradle cache because something else in
    // this project pulled it. Pinning the wrong one would give a codec that compiles and a
    // runtime that disagrees with the game's buffer.
    //
    // And the reason this is worth a dependency: **the channel order is a silent bug.** A codec
    // whose write order and read order disagree compiles, runs, and animates the wrong thing --
    // the sabre's parry plays as a wind-up -- and it is invisible with one player on the screen,
    // which is the only way this project has ever tested. This is the same failure shape as the
    // missing `@SubscribeEvent` that cost the arcabuz its fuse frames.
    testImplementation 'io.netty:netty-buffer:4.1.97.Final'
    testRuntimeOnly 'io.netty:netty-common:4.1.97.Final'

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // SnakeYAML, sombreado como Jar-in-Jar (verificado en docs.neoforged.net/toolchain/docs/
    // dependencies/jarinjar): el `jarJar` configuration embebe el artifact y su metadata en
    // META-INF/jarjar/metadata.json. **No relocaliza** -- es negociación por versión: si otro mod
    // trae SnakeYAML, NeoForge elige una copia que cumpla el rango. Por eso el `strictly` es
    // banda y no adorno: `[2.0,3.0)` dice hasta dónde este mod puede convivir.
    // SnakeYAML para el parser de weapon packs. **Tres declaraciones, y cada una es una
    // puerta distinta** (verificado en docs.neoforged.net/toolchain/docs/dependencies/
    // nonmclibs): en 1.21.8 y abajo -- este mod es 1.21.1 -- NeoForge NO carga dependencias
    // externas que no sean mods, así que `implementation` sólo alcanza para COMPILAR y las
    // runs revientan con NoClassDefFoundError hasta que la lib entra por
    // `additionalRuntimeClasspath`. (Desde 1.21.9 basta con implementation: cargan todo lo
    // que esté en el classpath.) Y producción se sirve con jarJar, que es la tercera puerta.
    implementation(group: 'org.yaml', name: 'snakeyaml', version: '2.3')
    if (mc121) {
        additionalRuntimeClasspath 'org.yaml:snakeyaml:2.3'
    } else {
        // FG6 runs build the game's classpath from the `minecraft` dependencies, not from
        // `implementation`: without this the jar is on the bootstrap -cp (unnamed module) and
        // the mod module cannot read it (ClassNotFoundException in ModuleClassLoader). The 1.21.1
        // leg solves the same gap with `additionalRuntimeClasspath`; this is its FG6 shape.
        // JarJar still serves production. (⌒‿⌒)
        minecraftLibrary(group: 'org.yaml', name: 'snakeyaml', version: '2.3')
    }
    jarJar(implementation(group: 'org.yaml', name: 'snakeyaml')) {
        version {
            strictly '[2.0,3.0)'
            prefer '2.3'
        }
    }
    if (!mc121) {
        // El annotation processor de Mixin (el fat jar con classifier `processor`
        // trae sus propias dependencias). Misma version que el runtime 0.8.5 que
        // reporta el log del server, o el refmap nace de otra version. (⌒‿⌒)
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

if (!mc121) {
    // El refmap de la 1.20.1: el nombre tiene que coincidir con el `refMap` del
    // JSON de la pata (src/v120/resources/cortescombat.mixins.json). El `config`
    // inyecta el JSON en las run configs y en el manifest de los jars ofuscados.
    mixin {
        add sourceSets.main, 'cortescombat.refmap.json'
        config 'cortescombat.mixins.json'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Textual guards read the shared tree through relative paths (src/main/java/...), and version
    // subprojects run with their own directory as CWD, where that path does not exist. So the
    // working directory is the root, on every leg: both legs assert the same shared sources, and
    // the chiseled copies are a build detail tests never observe. (⌒‿⌒)
    workingDir = rootProject.projectDir
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// src/generated/resources is a resource srcDir, so the datagen provider's content-hash cache
// rides into the jar. It is build bookkeeping, not mod content: the game never reads a .cache
// directory at the jar root, so this costs nothing at runtime -- but a release jar handed to
// someone else should carry only what the game actually loads.
//
// **Y la licencia es la excepción, por la razón contraria a la del .cache.** El proyecto es
// GPL-3.0-only y la GPL pide que la licencia acompañe la obra que se distribuye: un jar suelto en
// la carpeta de alguien tiene que llevar su licencia adentro, no depender de que tenga el repo a
// mano. `.cache` se va porque es contabilidad de build; `LICENSE` entra porque es un aviso legal.
tasks.named('jar', Jar).configure {
    exclude '.cache/**'
    // **Y los .md de desarrollo, que viajaban sin que nadie los leyera.** El juego no lee un README,
    // y `PROTOTYPE-ASSETS.md` decia "DO NOT SHIP THESE" DENTRO de un jar que se repartia: una nota
    // de provenance que se contradecia a si misma por estar en el lugar equivocado. Los archivos
    // .md viven en el repo, que es donde alguien los va a leer.
    exclude '**/*.md'
    from('LICENSE')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
//
// GOTCHA: the expansion runs through Groovy, so the template is a GString. Backticks in the
// template's comments break the parser outright with a confusing "Unexpected input" error far
// from the cause. Keep the template's comments plain text.
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    // Each leg expands only the properties its own template names. A missing property is a
    // configuration error, so the map is built per leg instead of shared: sharing it would make
    // the 1.20.1 leg demand neo_version and the 1.21.1 leg demand forge_version. (￣ω￣)
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    if (mc121) {
        replaceProperties.neo_version = neo_version
        replaceProperties.neo_version_range = neo_version_range
    } else {
        replaceProperties.forge_version_range = forge_version_range
    }
    inputs.properties replaceProperties
    expand replaceProperties
    // Without this, expand() reads and writes with the platform default charset, which mangles
    // non-ASCII in the metadata. Symptom: mod_name ships as "Cort<s-acute>s Combat".
    filteringCharset = 'UTF-8'
    from mc121 ? rootProject.file("src/main/templates") : rootProject.file("src/main/templates-1.20.1")
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
if (mc121) {
    // To avoid having to run "generateModMetadata" manually, make it run on every project reload
    neoForge.ideSyncTask generateModMetadata
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // The 1.20.1 leg is mid-port: capped errors hide the backlog behind an arbitrary
    // alphabet, and "101 errors" that change between runs are a counting artifact, not
    // progress. Uncapped on every leg (it changes nothing when there are no errors).
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// The 1.20.1 package rename, in plain Gradle. Stonecutter 0.7's `replacements` DSL was
// tried three ways (0.9 syntax, boolean+delegate, boolean+it) and every one died in
// configuration against the 0.7 API (verified method-by-method with javap: the wiring exists,
// the Groovy delegation does not land). So the leg renames its own tree with a Sync task it
// fully controls, instead of fighting the plugin's DSL.
//
// What it renames and why only that: NeoForge's 1.20.1 fork (and Forge 47.x, which is what the
// leg builds against) keeps the net.minecraftforge packages -- the rename to net.neoforged only
// happened in 20.2. JAVA_21 rides along because a grep finds it only in cortescombat.mixins.json.
// Root sources stay pristine; the renamed copy is a build detail under the leg's build dir.
// (⌒‿⌒)
if (!mc121) {
    def forgeSrc = tasks.register('renameForgeSources', Sync) {
        // Versiona las reglas: el Sync es up-to-date por contenido de entradas, y un cambio solo
        // en el closure del filter no lo invalida. Sin esto, editar las reglas recompila con el
        // arbol viejo y los errores mienten. (μ_μ)
                                inputs.property('renameRules', 'v35-drink-twin');
        // Tres reglas en orden de especificidad, porque el rename 20.1->20.2 no fue un
        // prefijo plano: bus.api cambio de nombre (eventbus) y el `neoforge` del medio se cayo.
        // Un reemplazo ciego de `net.neoforged` produce `net.minecraftforge.neoforge`, que no
        // existe en ninguna version y ensucia el backlog con ruido. (￣ω￣)
        def renameLine = { line -> line.replace('net.neoforged.neoforge.', 'net.minecraftforge.')
                .replace('net.neoforged.bus.', 'net.minecraftforge.eventbus.')
                // @EventBusSubscriber es anidada en 1.20.1 (@Mod.EventBusSubscriber, buses FORGE/MOD)
                // y el import suelto no existe: van ANTES del strip generico porque lo nombran con
                // el paquete viejo.
                .replace('import net.neoforged.fml.common.EventBusSubscriber;', 'import net.minecraftforge.fml.common.Mod;')
                .replace('@EventBusSubscriber(', '@Mod.EventBusSubscriber(')
                .replace('EventBusSubscriber.Bus.GAME', 'Mod.EventBusSubscriber.Bus.FORGE')
                .replace('EventBusSubscriber.Bus.MOD', 'Mod.EventBusSubscriber.Bus.MOD')
                .replace('net.neoforged.', 'net.minecraftforge.')
                // Los tick events son anidadas en 1.20.1: van DESPUES del strip porque buscan su
                // forma ya renombrada. Importar la anidada por nombre canonico compila.
                .replace('net.minecraftforge.event.tick.PlayerTickEvent', 'net.minecraftforge.event.TickEvent.PlayerTickEvent')
                .replace('net.minecraftforge.event.tick.ServerTickEvent', 'net.minecraftforge.event.TickEvent.ServerTickEvent')
                .replace('net.minecraftforge.client.event.ClientTickEvent', 'net.minecraftforge.event.TickEvent.ClientTickEvent')
                // Dos clases que ademas cambiaron de nombre y no solo de paquete: con solo el
                // prefijo quedarian en un paquete que existe con un nombre que no, que es el
                // error mas confuso de leer. Estas dos lineas lo convierten en el simbolo que
                // falta de verdad (o en codigo que compila, para EVENT_BUS). Van despues del
                // strip porque operan sobre su salida.
                .replace('net.minecraftforge.common.NeoForge', 'net.minecraftforge.common.MinecraftForge')
                .replace('net.minecraftforge.common.CommonHooks', 'net.minecraftforge.common.ForgeHooks')
                // Los call sites nombran el bus por su nombre corto; el import ya apunta a
                // MinecraftForge pero el uso dice NeoForge. Solo existe esta forma (28 usos,
                // verificados por grep): cualquier otro `NeoForge.<X>` seria otro rename.
                .replace('NeoForge.EVENT_BUS', 'MinecraftForge.EVENT_BUS')
                .replace('JAVA_21', 'JAVA_17') }
        // Root-anchored: the leg's CWD is versions/1.20.1, which has no src of its own.
        //
        // Los gemelos con cuerpo v120 NO se copian: el exclude va en el Sync y no en el
        // sourceSet, porque un exclude del sourceSet pega en TODOS los srcDirs -- incluido
        // src/v120, que es justo el que trae el reemplazo -- y la pata compila sin el paquete
        // entero, con un error que apunta a los importadores y no a la causa. (￣ω￣)
