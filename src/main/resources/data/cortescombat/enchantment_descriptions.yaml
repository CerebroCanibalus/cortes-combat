# Descripciones de encantamientos -- Cortes Combat
#
# **Este archivo es la tabla, y es el unico lugar donde se escribe una descripcion.**
# El mod lo lee al generar los idiomas y escribe `enchantment.cortescombat.<id>.desc`, que es la
# clave que lee Enchantment Descriptions (Darkhax) para mostrarla en el tooltip.
#
# Agregar o corregir una descripcion NO toca Java: una entrada aca y `runData`.
# `EnchantmentDescriptionsTest` camina los 48 ids y exige las DOS lenguas, asi que una entrada que
# falte rompe el build en vez de dejar un encantamiento mudo.
#
# Criterio (ronda del 2026-10-27, segunda pasada): **enigma con el mecanismo adentro.** Cada linea
# dice cual es el disparador y que se siente, con la escala sugerida por palabras (nivel, pausa,
# cadena). Sin fichas tecnicas y sin estas construcciones, que el dueno veto por nombre:
#   - epanortosis enfatica ("o mas bien", "digamos");
#   - coordinadas adversativas ("pero", "sino", "aunque");
#   - retoricas de contraste ("No es X, sino Y", "No solo X, sino tambien Y", "Mas que X, es Y").
# El registro es el de un objeto del juego que se recuerda, no el de un manual.


midas_touch:
  es: "Cada cuerpo que cae escupe oro, y mientras más hondo el nivel, más oro."
  en: "Every body that falls spits gold, and the deeper the level, the more gold."

gold_echo:
  es: "Tu golpe lo enciende: brilla para todos y el mundo le pega más fuerte."
  en: "Your hit sets it alight: it glows for everyone, and the world hits it harder."

life_steal:
  es: "Cada tajo te devuelve un hilo de la vida que quitaste."
  en: "Every cut gives you back a thread of the life you took."

wind_walker:
  es: "El viento camina contigo; cada nivel alarga el paso."
  en: "The wind walks with you; each level lengthens your stride."

feather_weight:
  es: "El arma se vuelve pluma y el brazo llega antes."
  en: "The weapon turns to feather and the arm arrives sooner."

phantom_strike:
  es: "A veces el filo encuentra el hueco de la armadura, y cada nivel lo encuentra más seguido."
  en: "Sometimes the edge finds the gap in the armour, and each level finds it more often."

midas_tool:
  es: "La mena sale dorada de la piedra, y el nivel decide cuántas veces."
  en: "The ore comes out of the stone golden, and the level decides how often."

miner_frenzy:
  es: "La piedra cede más aprisa con cada bloque roto; la pausa borra la cuenta."
  en: "Stone gives way faster with every block broken; a pause wipes the count."

golden_hands:
  es: "Lo que la pala arranca aterriza en tu bolsillo."
  en: "What the shovel tears loose lands in your pocket."

golden_harvest:
  es: "La azada devuelve la semilla a la tierra, y el nivel alto cobra doble."
  en: "The hoe puts the seed back in the earth, and the high level collects twice."

phantom_block:
  es: "Algunos bloques entregan su tesoro por duplicado."
  en: "Some blocks hand over their treasure doubled."

steel_reflex:
  es: "El desvío vuelve antes con cada nivel: el acero recuerda el golpe."
  en: "The parry returns sooner with each level: the steel remembers the blow."

audacity:
  es: "El lunge cuesta menos con cada nivel; la audacia se paga sola."
  en: "The lunge costs less with each level; audacity pays for itself."

adrenalina:
  es: "El dolor te endereza: el golpe entra más suave y tus piernas despiertan. Al nivel mayor, la deuda vuelve contigo."
  en: "Pain straightens you: the blow lands softer and your legs wake up. At the higher level, the debt comes back with you."

rhythm_of_iron:
  es: "La cadena del martillo aguanta un compás más con cada nivel."
  en: "The hammer's chain holds one more beat with each level."

riposte:
  es: "Tras tu guardia, el golpe busca la juntura de la armadura."
  en: "After your guard, the blow looks for the seam in the armour."

dry_powder:
  es: "La pólvora seca recarga antes: el arcabuz vuelve a hablar."
  en: "Dry powder reloads sooner: the arcabuz speaks again."

punta_fina:
  es: "De cerca, la punta encuentra la carne."
  en: "Up close, the point finds the flesh."

filo_astillado:
  es: "Cada placa del rival trabaja para tu filo."
  en: "Every plate on the target works for your edge."

apunalar:
  es: "El que no te ve recibe el doble."
  en: "The one who does not see you takes double."

sanguijuela:
  es: "Su sangre termina en tu herida."
  en: "Their blood ends up in your wound."

aventurero:
  es: "Los que caen por tu mano dejan más experiencia."
  en: "Those who fall by your hand leave more experience."

culata:
  es: "La culata golpea como un ariete."
  en: "The stock strikes like a ram."

estocada:
  es: "La estocada del lunge se cuela entre las placas."
  en: "The lunge's thrust slips between the plates."

segundo_aliento:
  es: "Cuando cae tu guardia, el brazo se enciende una última vez."
  en: "When your guard falls, the arm catches fire one last time."

guardia_firme:
  es: "El primer golpe de cada tregua se estrella sin cobrar."
  en: "The first blow of each truce breaks without a price."

cicatrizador:
  es: "La herida que abres cierra mal."
  en: "The wound you open closes badly."

destripamiento:
  es: "El golpe cargado deja la herida abierta, y la herida sigue sangrando."
  en: "The charged blow leaves the wound open, and the wound keeps bleeding."

quebranto:
  es: "Cada golpe afloja una placa."
  en: "Every hit loosens a plate."

desvio_vampirico:
  es: "Cada desvío te roba un aliento de vida."
  en: "Every parry steals a breath of life."

mecha_corta:
  es: "La mecha se consume antes de lo que el ojo espera."
  en: "The fuse burns down before the eye expects it."

barredor:
  es: "El barrido alcanza donde no estabas mirando."
  en: "The sweep reaches where you were not looking."

astilladora:
  es: "Bloquear este filo cansa el doble."
  en: "Blocking this edge tires you twice as fast."

mella:
  es: "La armadura del rival se deshace en tus manos."
  en: "The target's armour comes apart in your hands."

segunda_pasada:
  es: "El barrido que no mata devuelve parte de tu brazo."
  en: "The sweep that kills nobody gives part of your arm back."

santa_muerte:
  es: "Lo que matas deja un aire que apesta."
  en: "What you kill leaves a reeking air behind."

inercia:
  es: "El empuje de la cadena levanta al rival del suelo."
  en: "The chain's shove lifts the target off the ground."

ensarte:
  es: "La estocada sigue de largo y encuentra otro cuerpo."
  en: "The thrust carries on and finds another body."

paliza:
  es: "El golpe que cierra la serie despide al rival."
  en: "The blow that closes the streak sends the target away."

sentencia:
  es: "Al quinto golpe de la cadena, el cuerpo revienta."
  en: "On the fifth hit of the chain, the body bursts."

trabazon:
  es: "El golpe cargado clava al rival en el sitio."
  en: "The charged blow pins the target in place."

gripa:
  es: "Los golpes dejan moco, y el moco pesa."
  en: "Hits leave muck, and muck weighs."

corte_gemelo:
  es: "El corte llama a su gemelo."
  en: "The cut calls its twin."

capacitor:
  es: "Lo que te lanzan vuelve como rayo."
  en: "What they throw at you comes back as lightning."

rey_de_las_moscas:
  es: "El disparo deja moscas donde toca, y las moscas se quedan."
  en: "The shot leaves flies where it lands, and the flies stay."

retirada:
  es: "Agachado, el lunge salta hacia atrás y el golpe espera en la mano."
  en: "Crouched, the lunge leaps backwards and the blow waits in your hand."

pala_antimaterial:
  es: "El orbe llama a su alrededor y lo borra."
  en: "The orb calls everything around it and erases it."

mungus:
  es: "Diez Firestones compran un cráter."
  en: "Ten Firestones buy a crater."
