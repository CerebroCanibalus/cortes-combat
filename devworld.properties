# World seed and default game rules for the dev test world.
#
# The dev run uses a fixed seed and fixed gamerules so that "it did not hit last time" and
# "it hit last time" mean the same thing. A random world makes every session a different
# test: mobs spawn in different places, the player starts elsewhere, and a reach test
# against a wall is not reproducible.
#
# The world is NOT deleted between runs. It is only regenerated if this file changes.
#
# See runserver-ish notes in AGENTS.md for how the world gets created.

# Fixed seed. Any number works; this one was picked arbitrarily and never needs changing.
world_seed=cortes-combat-test

# Where the player spawns and faces. Facing south (-Z) so a wall of targets can be built
# directly ahead and cone tests are not at the mercy of where the spawn rotation lands.
spawn_x=0.5
spawn_y=80
spawn_z=0.5
spawn_yaw=0.0
spawn_pitch=0.0

# ---------------------------------------------------------------
# Gamerules. Only the ones that would change combat testing.
# ---------------------------------------------------------------

# Peaceful would stop mobs fighting back, which makes damage and guard untestable.
gamemode=1
difficulty=2
invulnerable=false

# Mobs must be able to approach, so keep spawning on and spread the spawn radius a bit.
doMobSpawning=true
mobSpawnRadius=32

# Time frozen: a fixed daylight means the vignette test is never ruined by nightfall.
doDaylightCycle=false
doWeatherCycle=false
doDaylightCycleTime=6000

# Keep the player alive between tests without removing the danger.
naturalRegeneration=false
keepInventory=true

# No fall damage and no drowning, so a test never ends for an unrelated reason.
fallDamage=false
waterSourceConversion=false

# Cheat-ish but needed: instant break, so a test obstacle never stalls a session.
mobGriefing=false
